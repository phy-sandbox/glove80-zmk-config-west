# -----------------------------------------------------------------------------
# Shared runtime defaults for dongle firmware.
# Keep these aligned with config/glove80.conf unless dongle-specific behavior is needed.
# -----------------------------------------------------------------------------

# Increase transmit power for better reliability.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Logging is helpful while tuning and troubleshooting.
CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_RTT_LOGGING=n

# -----------------------------------------------------------------------------
# Dongle-only settings
# -----------------------------------------------------------------------------

# Prefer USB output on the dongle; BLE profile keys should not steal output
# away from the host connection.
CONFIG_ZMK_USB=y

# Explicitly enable BLE and central role for dongle
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Central tracks left and right halves.
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

# Reserve link slots for both split peripherals plus up to four host connections.
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Increase split queue headroom for 2 peripherals
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=32

# Mouse emulation (software mouse keys via HID pointing).
CONFIG_ZMK_POINTING=y

# Underglow indicator state broadcast coalesce window
# Increased to 100ms to reduce BLE traffic and queue pressure
CONFIG_ZMK_SPLIT_BLE_CENTRAL_STATUS_COALESCE_MS=100
