# -----------------------------------------------------------------------------
# Base Glove80 settings
#
# This file is the shared config baseline.
# Dongle-only additions remain in config/glove80_dongle.conf.
# -----------------------------------------------------------------------------

# USB policy is target-specific:
# - glove80_lh/glove80_rh disable USB so the halves stay BLE peripherals
# - glove80_dongle enables USB so the dongle stays host-facing

# Logging is helpful while tuning and troubleshooting.
CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_RTT_LOGGING=n

# RGB underglow defaults.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y
CONFIG_ZMK_EXT_POWER_START=n
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=4
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=4
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=80
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=285
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=75
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=16

# Per-layer RGB underglow support (central topology moved from LH to dongle).
CONFIG_EXPERIMENTAL_RGB_LAYER=y
# Reduce idle/suspend power draw on the dongle.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
