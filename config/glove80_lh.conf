# Intended dongle-only build: USB is disabled on the left half.
# Force left-half peripheral role to avoid upstream default left-central topology.
CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
CONFIG_ZMK_HID_INDICATORS=y

# Peripheral-only limits: keep exactly one active BLE link (to dongle central).
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_MAX_CONN=1
